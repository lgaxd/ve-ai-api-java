# Vê AI · ambiente local (perfil "local")
# Subir:   docker compose up -d
# Parar:   docker compose down        (os dados ficam no volume; "down -v" apaga tudo)
# Painel do RabbitMQ: http://localhost:15672  (veai / veai)
name: ve-ai

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veai
      POSTGRES_USER: veai
      POSTGRES_PASSWORD: veai
    ports:
      - "5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veai -d veai"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: veai
      RABBITMQ_DEFAULT_PASS: veai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-dados:
  rabbitmq-dados:
