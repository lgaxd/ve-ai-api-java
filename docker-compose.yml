# Vê AI · ambiente local (perfil "local"): Oracle XE + RabbitMQ
# Alternativa ao Oracle da FIAP para desenvolver e testar sem depender da rede da faculdade.
#
#   docker compose up -d        # a 1ª subida baixa as imagens; aguarde "healthy" em: docker compose ps
#   ./mvnw spring-boot:run      # o Flyway cria tabelas, PL/SQL e seed no 1º start da API
#   docker compose down         # para (os dados ficam no volume; "down -v" apaga tudo)
#
# Oracle:   localhost:1521, serviço XEPDB1, usuário veai / senha veai
#           (SQL Developer: Host localhost · Porta 1521 · Nome do serviço XEPDB1)
# RabbitMQ: painel em http://localhost:15672 (veai / veai)
# Credenciais fixas de propósito: este banco é só de desenvolvimento, na sua máquina.
name: ve-ai

services:
  oracle:
    # XE 21 é a versão gratuita mais próxima do Oracle 19c da FIAP (sem tipo BOOLEAN nativo,
    # então o Hibernate grava os booleanos em NUMBER(1), igual ao DDL do repositório database)
    image: gvenzl/oracle-xe:21-slim-faststart
    environment:
      ORACLE_PASSWORD: veai          # senha de SYS/SYSTEM
      APP_USER: veai                 # schema da aplicação, criado em XEPDB1
      APP_USER_PASSWORD: veai
    ports:
      - "1521:1521"
    volumes:
      - oracle-dados:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: veai
      RABBITMQ_DEFAULT_PASS: veai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oracle-dados:
  rabbitmq-dados:
