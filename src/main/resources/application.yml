# =============================================================================
# Vê AI · API Java · configuração comum a todos os perfis
# Perfis: local (Oracle XE no docker-compose) · fiap (Oracle da FIAP) · azure (Azure SQL)
# Segredos SEMPRE por variável de ambiente ou pelo arquivo .env (ver .env.example).
# =============================================================================
spring:
  application:
    name: ve-ai-api-java
  config:
    # Lê o .env da raiz do projeto (se existir). Variáveis de ambiente reais têm prioridade.
    import: optional:file:.env[.properties]
  profiles:
    # SPRING_PROFILES_ACTIVE pode vir do ambiente ou do .env; sem nada, sobe o perfil local
    active: ${SPRING_PROFILES_ACTIVE:local}
    group:
      local: oracle
      fiap: oracle
      test: oracle

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Chaves de mapa com "_" vão entre colchetes para o Spring não alterar o nome
        "[jdbc.time_zone]": UTC

  flyway:
    enabled: true
    # db/migration/{vendor} = oracle ou sqlserver; o seed de demo entra nos perfis que o pedem
    locations: classpath:db/migration/{vendor}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  rabbitmq:
    # CloudAMQP fornece uma URL amqps://usuario:senha@host/vhost
    addresses: ${RABBITMQ_URL:amqp://veai:veai@localhost:5672}
    listener:
      simple:
        acknowledge-mode: manual
        # mensagem que nem chega ao listener (JSON inválido) vai para a DLQ, sem loop
        default-requeue-rejected: false
        prefetch: 10
    template:
      retry:
        enabled: true
        max-retries: 3

  ai:
    model:
      # Só liga o modelo de chat da OpenAI quando veai.ia.provedor = openai
      chat: ${veai.ia.provedor}
      embedding: none
      image: none
      audio.speech: none
      audio.transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${veai.ia.modelo}
        # Vazio = não envia temperature. Os modelos de raciocínio (GPT-5 em diante, como o
        # gpt-6-luna) recusam qualquer valor diferente do padrão (1) com HTTP 400.
        # Para modelos como gpt-4o/gpt-4.1, dá para fixar, por exemplo, OPENAI_TEMPERATURE=0.2.
        temperature: ${OPENAI_TEMPERATURE:}

  jackson:
    default-property-inclusion: always

  web:
    error:
      # Mensagens de exceção nunca vão para o cliente (o TratadorErros monta as respostas)
      include-message: never

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  health:
    defaults:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

veai:
  jwt:
    segredo: ${JWT_SECRET:troque-este-segredo-local-com-32-caracteres-ou-mais}
    validade: 8h
    emissor: ve-ai-api
  ia:
    # openai = GPT via Spring AI (gasta créditos) · falso = respostas fixas, sem custo
    provedor: ${VEAI_IA_PROVEDOR:falso}
    modelo: ${OPENAI_MODEL:gpt-6-luna}
    confianca-minima: 0.7
    tamanho-maximo-bytes: 5242880
  rag:
    # Serviço RAG do Pedro (FastAPI). Vazio = desligado.
    url: ${VEAI_RAG_URL:}
    timeout: 3s
  rate-limit:
    descricoes-por-minuto: ${VEAI_RATE_LIMIT:20}
  relato:
    raio-deduplicacao-metros: 30
    validade-idempotencia: 24h
  cors:
    origens: ${VEAI_CORS_ORIGENS:*}

logging:
  level:
    "[br.com.fiap.veai]": INFO

---
# Ajustes comuns aos perfis Oracle (local, fiap e test). O schema é o mesmo do repositório
# database (oracle/01_ddl.sql + PL/SQL), criado pelo Flyway em db/migration/oracle.
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # O Oracle da FIAP limita as sessões por aluno: poucas conexões bastam
      maximum-pool-size: ${DB_POOL_MAX:5}
  jpa:
    hibernate:
      # O schema do Oracle segue o DDL do repositório database (NUMBER, DATE, CLOB),
      # que não bate tipo a tipo com o que o Hibernate geraria (float, timestamp...).
      # Quem garante o schema é o Flyway; os testes de integração rodam contra Oracle real.
      ddl-auto: none
    properties:
      hibernate:
        # As colunas de data são DATE (como no 01_ddl.sql): Instant é gravado como TIMESTAMP simples
        "[type.preferred_instant_jdbc_type]": TIMESTAMP
        # Fuso usado para gravar/ler as colunas DATE (SYSDATE do PL/SQL usa o fuso do servidor)
        "[jdbc.time_zone]": ${DB_TIME_ZONE:UTC}
  flyway:
    locations: classpath:db/migration/{vendor},classpath:db/seed/{vendor}
    # Histórico próprio: o schema da FIAP pode ser compartilhado com outro projeto que também usa
    # Flyway (ex.: PetFlow, com a tabela padrão flyway_schema_history), e os históricos não podem se misturar
    table: veai_flyway_historico
    # Schema da FIAP pode já ter as tabelas do repositório database (00_instalar.sql):
    # as migrações são idempotentes, então o baseline em 0 aplica todas sem recriar nada.
    baseline-on-migrate: true
    baseline-version: 0

---
# Desenvolvimento: Oracle XE + RabbitMQ do docker-compose.yml (docker compose up -d)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${LOCAL_DB_USER:veai}
    password: ${LOCAL_DB_PASSWORD:veai}

---
# Java Advanced: Oracle da FIAP (oracle.fiap.com.br) + RabbitMQ (local ou CloudAMQP)
spring:
  config:
    activate:
      on-profile: fiap
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

---
# DevOps: Azure SQL + CloudAMQP (o V1 de sqlserver é também o script-bd.sql)
spring:
  config:
    activate:
      on-profile: azure
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        # Textos em NVARCHAR (acentos), como no V1 do SQL Server
        "[use_nationalized_character_data]": true
  flyway:
    locations: classpath:db/migration/{vendor},classpath:db/seed/{vendor}
