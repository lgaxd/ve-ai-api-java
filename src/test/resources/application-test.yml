# Testes de integração: banco e broker vêm do Testcontainers (@ServiceConnection).
spring:
  flyway:
    # Mesmo schema da produção + o seed de demo (gestores e regiões usados nos testes)
    locations: classpath:db/migration/{vendor},classpath:db/seed/{vendor}
  rabbitmq:
    # Ignora a RABBITMQ_URL do .env do desenvolvedor: com amqps:// (CloudAMQP) o Spring liga o TLS,
    # e o RabbitMQ do Testcontainers não usa TLS. Host, porta e usuário vêm do @ServiceConnection.
    addresses: amqp://localhost

veai:
  ia:
    provedor: falso
  rate-limit:
    descricoes-por-minuto: 5
  jwt:
    segredo: segredo-dos-testes-com-mais-de-32-caracteres

logging:
  level:
    br.com.fiap.veai: WARN
    org.testcontainers: WARN
